refresh:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: checkpoint_spark
get_report:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: checkpoint_spark
    report_type:
      required: true
      selector:
        select:
          options: [hourly, daily, weekly, monthly]
          translation_key: report_type
show_command:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: checkpoint_spark
    command:
      required: true
      example: show diag
      selector:
        text:
syslog_messages:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: checkpoint_spark
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 200
    product:
      example: Anti-Virus
      selector:
        text:
detections:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: checkpoint_spark
    days:
      default: 7
      selector:
        number:
          min: 1
          max: 365
    kind:
      selector:
        select:
          options: [ips_attack, malware_detected]
telemetry_metrics:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: checkpoint_spark
    prefix:
      example: cpu
      selector:
        text:
    limit:
      default: 200
      selector:
        number:
          min: 1
          max: 2000
